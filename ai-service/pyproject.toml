[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.1.0"
description = "999 Combo Store AI Agent Service (FastAPI + LangChain/LangGraph + RAG)"
authors = [{ name = "999 Combo Store Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langchain>=0.1.14",
    "langchain-core>=0.1.38",
    "langchain-community>=0.0.31",
    "langchain-anthropic>=0.1.8",
    "langgraph>=0.0.32",
    "sentence-transformers>=2.6.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]
